{% extends "base.html" %}
{% block title %}Sign In · PayRoll{% endblock %}

{% block content %}
  <section class="card form-card" style="max-width:420px;margin:60px auto;">
    <div class="section-heading">
      <div class="section-icon"><i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i></div>
      <div>
        <h2>Sign In</h2>
        <p class="muted small">Enter your credentials to continue.</p>
      </div>
    </div>

    <form method="POST" class="form-grid" novalidate>
      <div class="form-group">
        <label for="username"><i class="fa-regular fa-user" aria-hidden="true"></i> Username</label>
        <input id="username" name="username" class="form-control"
               required autofocus autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password"><i class="fa-solid fa-lock" aria-hidden="true"></i> Password</label>
        <div class="input-with-icon input-with-toggle">
          <i class="fa-solid fa-lock" aria-hidden="true"></i>
          <input id="password" name="password" type="password" class="form-control"
                 required autocomplete="current-password">
          <button type="button" class="password-toggle toggle-visibility" data-target="password" aria-label="Show password" aria-pressed="false">
            <i class="fa-solid fa-eye" aria-hidden="true"></i>
          </button>
        </div>
      </div>

      <div class="form-actions-row">
        <button type="submit" class="btn btn-primary form-submit">
          <i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i>
          <span class="btn-label">Sign In</span>
        </button>
      </div>
    </form>
  </section>
{% endblock %}
